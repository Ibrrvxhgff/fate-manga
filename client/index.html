async function dev(){if(!DEV){main.innerHTML='<details open><summary>دخول المطوّر</summary><p class="c">يتم التحقق على الخادم. لا تضع كود المطوّر داخل رابط أو ملف HTML.</p><label><span>كود المطوّر</span><input id="dcode" type="password" inputmode="numeric" autocomplete="off"></label><div class="bar"><button class="acc" data-act="devLogin">دخول آمن</button></div><p id="de"></p></details>';return}try{const r=await fetch('/api/dev/state',{credentials:'same-origin'});if(!r.ok){DEV=false;return dev()}const j=await r.json(),editableSources=j.sources?.length?j.sources:SRCS;main.innerHTML=`<details open><summary>لوحة المطوّر</summary><div class="bar"><button data-act="devLogout">تسجيل الخروج</button><button class="acc" data-act="newCode">إنشاء كود جديد</button></div><p id="newcode" class="c"></p><h4>أكواد الدخول</h4>${j.codes.map(c=>`<div class="bar"><span>${esc(c.label)} — ${esc(c.id.slice(0,8))}</span><button data-act="delCode" data-id="${esc(c.id)}">إلغاء</button></div>`).join('')}<h4>قالب البروكسي</h4><input id="devproxy" value="${esc(j.settings?.proxyTemplate||'')}"><div class="bar"><button class="acc" data-act="saveDevSettings">حفظ الإعدادات</button></div><h4>المصادر والكوكيز</h4><p class="c">يتم حفظ هذا JSON على الخادم. لا تشارك الكوكيز أو أكواد الدخول.</p><textarea id="devsources" style="min-height:300px">${esc(JSON.stringify(editableSources,null,2))}</textarea><div class="bar"><button class="acc" data-act="saveDevSources">حفظ المصادر للجميع</button></div></details>`}catch(e){main.innerHTML=`<p class="c err">تعذر فتح لوحة المطوّر: ${esc(e.message)}</p>`}}
document.addEventListener('input',e=>{const el=e.target,k=el.dataset?.k,si=el.dataset?.si;
  if(si!==undefined){const x=SRCS[+si];let v=el.type==='checkbox'?el.checked:el.value.trim();if(el.dataset.sk==='base')v=v.replace(/\/+$/,'');sp(x,el.dataset.sk,v);ls.s('srcs',SRCS);return}
  if(!k)return;const v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;sp(S,k,v);save();if(el.type==='range')el.nextElementSibling.textContent=v;if(R&&!$('#rd').hidden&&['r','rmode','fit','rtl','gap','rbg','bright','filter','preload'].includes(k))drawR()});

/* ---------- diagnose: يطلع لك بالضبط وش يشوف التطبيق ---------- */
async function diag(){const out=$('#dg'),sr=CS,w=t=>{out.textContent+=t+'\n'};out.textContent='';cache.clear();
  w(`المصدر: ${sr.name} [${sr.kind}] ${sr.base}\nmode=${S.mode} bridge=${hasBridge()} imgT=${sr.imgT} cookie=${sr.cookie?'yes':'no'}\n`);
  for(const t of[...new Set([sr.ok,sr.list,...(sr.alt||[])].filter(Boolean))]){const u=sr.base+tpl(t,{p:1,q:''});
    try{const r=await get(u,{src:sr}),d=parse(r.text),l=listing(d,u,sr);
      w(`✓ ${r.status} ${u}\n   bytes=${r.text.length} a=${q(d,'a').length} astro=${q(d,'astro-island').length} items=${l.length}`+(l[0]?`\n   مثال: ${l[0].t}\n   url:   ${l[0].u}\n   cover: ${l[0].c}`:''))}
    catch(e){w(`✗ ${u}\n   ${e.message}`)}}
  if(sr.kind==='swat'){try{w('API series: '+JSON.stringify(await swatJ(sr,'series/?page_size=1&order_by=-created_at')).slice(0,700)+'\n')}catch(e){w('✗ API series: '+e.message+'\n')}}
  const cu=$('#dgu').value.trim();
  if(cu){const s2=srcOf(cu);w(`\n— فصل: ${cu}  (${s2.name})`);
    try{if(s2.kind==='swat'){try{w('API chapter: '+JSON.stringify(await swatJ(s2,`chapter/${sid(cu)}/`)).slice(0,900))}catch(e){w('✗ API chapter: '+e.message)}}else{const r=await get(cu,{src:s2}),x=extractImgs(r.text,cu),api=apiUrls(r.text,s2);
      w(`bytes=${r.text.length} dom=${x.dom.length} script=${x.sc.length} astro=${x.as.length} api=${api.length}${api[0]?'\n   api: '+api.slice(0,3).join('\n        '):''}`)}
      const im=await chImgs(cu);w(`النتيجة النهائية: ${im.length} صورة`);im.slice(0,3).forEach(z=>w('   '+z));
      if(im[0]){try{const b=await get(im[0],{type:'blob',src:s2,headers:{Referer:cu}});w(`أول صورة عبر الطبقة ✓ ${b.status} ${b.blob?.size||0}B`)}catch(e){w('أول صورة عبر الطبقة ✗ '+e.message)}}}
    catch(e){w('✗ '+e.message)}}
  w('\nانسخ هذا الناتج وأرسله.')}

/* ---------- actions ---------- */
const A={
  devOpen:dev,
  async devLogin(){const code=$('#dcode')?.value.trim();const r=await fetch('/api/dev/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({code})});if(!r.ok){$('#de').textContent='الكود غير صحيح';return}DEV=true;toast('تم دخول المطوّر');dev()},
  async devLogout(){await fetch('/api/dev/logout',{method:'POST',headers:devHeaders(),credentials:'same-origin'});DEV=false;toast('تم تسجيل الخروج');setView()},
  async newCode(){const r=await fetch('/api/dev/codes',{method:'POST',headers:devHeaders({'Content-Type':'application/json'}),credentials:'same-origin',body:JSON.stringify({label:'كود مطوّر'})});if(!r.ok)return toast('تعذر إنشاء الكود');const j=await r.json();dev();setTimeout(()=>{$('#newcode').textContent='الكود الجديد — انسخه الآن: '+j.code},0)},
  async delCode(t){if(!confirm('إلغاء هذا الكود؟'))return;const r=await fetch('/api/dev/codes/'+encodeURIComponent(t.dataset.id),{method:'DELETE',headers:devHeaders(),credentials:'same-origin'});toast(r.ok?'تم إلغاء الكود':'لا يمكن إلغاء آخر كود');dev()},
  async saveDevSettings(){const r=await fetch('/api/dev/settings',{method:'PUT',headers:devHeaders({'Content-Type':'application/json'}),credentials:'same-origin',body:JSON.stringify({proxyTemplate:$('#devproxy').value.trim()})});toast(r.ok?'تم حفظ إعدادات البروكسي للجميع':'قالب البروكسي غير صالح')},
  async saveDevSources(){try{const sources=JSON.parse($('#devsources').value);if(!Array.isArray(sources))throw Error('INVALID_JSON');const r=await fetch('/api/dev/sources',{method:'PUT',headers:devHeaders({'Content-Type':'application/json'}),credentials:'same-origin',body:JSON.stringify({sources})});let detail='';try{const body=await r.json();detail=body.message||body.error||''}catch{}if(!r.ok){toast(detail||`فشل حفظ المصادر (${r.status})`);return}toast('تم تحديث المصادر للجميع')}catch(e){toast(e?.message==='INVALID_JSON'?'JSON المصادر غير صالح':'تعذر الاتصال بالخادم أثناء حفظ المصادر') }},
  search(){qs=$('#q').value.trim();if(!qs)return toast('اكتب اسم المانجا أولاً');rememberSearch(qs);hideSuggestions();announce('جارٍ البحث عن '+qs);if(!hs)return sall();go('home')},sall,
  clearSearch(){qs='';$('#q').value='';$('#clearSearch').hidden=true;hideSuggestions();announce('تم مسح البحث');if(tab==='home')go('home')},
  searchSuggestion(t){$('#q').value=t.dataset.searchSuggestion||'';A.search()},
  pick(t){hs=t.dataset.id;CS=SRCS.find(x=>x.id===hs)||SRCS[0];ls.s('hs',hs);qs='';$('#q').value='';go('home')},
  back(){qs='';$('#q').value='';picker()},
  sadd(){const id='s'+Date.now();SRCS.push(norm({id,name:'مصدر '+(SRCS.length+1),base:'https://',...MAD}));ls.s('srcs',SRCS);setView()},
  sdel(t){if(SRCS.length<2||!confirm('حذف المصدر؟'))return;const x=SRCS.splice(+t.dataset.i,1)[0];if(CS===x)CS=SRCS[0];if(hs===x.id){hs='';ls.s('hs','')}ls.s('srcs',SRCS);setView()},
  tocf(t){CS=SRCS.find(x=>x.id===t.dataset.id)||CS;go('cf')},retry(){home()},more:loadAll,open(t){detail(t.dataset.u)},
  read(t){read(+t.dataset.i,+t.dataset.p||0)},close:closeR,next,prev,rset(){const s=$('#rs');s.hidden=!s.hidden;s.innerHTML=SCH[1][2].map(fld).join('')},
  fav(){const u=cur.m.u,i=FAV.findIndex(f=>f.u===u);i<0?FAV.push(cur.m):FAV.splice(i,1);ls.s('fav',FAV);detail(u)},
  cfload(){$('#cff').src=CS.base},cfopen(){window.open(CS.base,'_blank')},cfsync:sync,cfmanual(){const value=window.prompt('الصق Cookies الخاصة بـ '+CS.name+' هنا. ابحث عن cf_clearance بعد حل تحدي Cloudflare:','');if(value===null)return;$('#cfc').value=value.trim();A.cfsave()},cfsave(){CS.cookie=$('#cfc').value.trim().replace(/;\s*(?=\S)/g,'; ').replace(/;\s*$/,'');save();toast(/(?:^|;\s*)cf_clearance=/.test(CS.cookie)?'تم الحفظ ✓ — تم العثور على cf_clearance':'تم الحفظ، لكن لم نجد cf_clearance في النص')},
  diag,
  async test(){cache.clear();try{const r=await get(CS.base+'/');toast('✓ '+r.status+' — '+listing(parse(r.text),CS.base,CS).length+' عنصر')}catch(e){toast('✗ '+e.message)}},
  clr(){cache.clear();toast('تم مسح الكاش')},exp(){$('#ex').value=JSON.stringify({cfg:S,srcs:SRCS,fav:FAV,prog:P})},
  imp(){try{const o=JSON.parse($('#ex').value);if(o.cfg){S={...D,...o.cfg};save()}
    if(o.srcs){SRCS=o.srcs;SRCS.forEach(norm);CS=SRCS[0];hs='';ls.s('hs','');save()}
    if(o.fav){FAV=o.fav;ls.s('fav',FAV)}if(o.prog){P=o.prog;ls.s('prog',P)}toast('تم الاستيراد');setView()}catch{toast('JSON غير صالح')}},
  rst(){if(confirm('إعادة ضبط كل الإعدادات؟')){S={...D};save();setView()}}};
document.addEventListener('click',e=>{const s=e.target.closest('[data-search-suggestion]');if(s){A.searchSuggestion(s);return}const t=e.target.closest('[data-act]');if(t){A[t.dataset.act]?.(t);return}const n=e.target.closest('nav [data-t]');if(n)go(n.dataset.t)});
  document.addEventListener('change',e=>{if(e.target.id==='cfsrc'){CS=SRCS[+e.target.value];cf()}if(e.target.dataset?.filter){const k=e.target.dataset.filter;filters[k]=k==='min'?+e.target.value:e.target.value;renderHome(CS)}});
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();A.search()});
$('#q').addEventListener('input',e=>{$('#clearSearch').hidden=!e.target.value;drawSuggestions(e.target.value)});
$('#q').addEventListener('focus',e=>drawSuggestions(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('#searchForm'))hideSuggestions()});
  loadRemoteSourceConfig().finally(()=>{theme();go('home');autoIcons()});
</script>
